# Compila el APK de Android (arm64, el de casi todos los celulares) en GitHub Actions.
# Se corre a mano (pestaña Actions → Android APK → Run workflow) o con cada push a main.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04  # fijo: trae el SDK de Android preinstalado
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Librerías nativas (libvips y compañía): tardan, así que se guardan en caché
      # y solo se recompilan si cambia algo en cmake/.
      - name: Restaurar librerías nativas
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: cmake/build-android-aarch64/sysroot
          key: android-aarch64-native-${{ hashFiles('cmake/**', '!cmake/build-*/**') }}

      - name: Compilar librerías nativas (Docker del proyecto)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          docker build -t komelia-build-android . -f ./cmake/android.Dockerfile
          # mismo usuario que el runner para poder escribir en la carpeta del repo
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/build komelia-build-android aarch64

      # se guarda en seguida, así no se pierde aunque falle un paso posterior
      - name: Guardar librerías nativas
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cmake/build-android-aarch64/sysroot
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Gradle descarga solo lo que falte del SDK si las licencias están aceptadas.
      # Esto no corta la compilación: solo acepta licencias y muestra qué hay, por si hay que diagnosticar.
      - name: Licencias del SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | head -20 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          ./gradlew android-aarch64_copyJniLibs
          ./gradlew buildEpubReaders
          ./gradlew :androidDebug

      - uses: actions/upload-artifact@v4
        with:
          name: komelia-requests-debug-apk
          path: komelia-app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
